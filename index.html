function decodeDocument(encoded){
 const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
 return new TextDecoder("utf-8").decode(bytes);
}
let loaded={};
let darkMode=false;
try{darkMode=localStorage.getItem('pt-learning-theme')==='dark'}catch(e){}
function applyTheme(){
 document.documentElement.classList.toggle('dark',darkMode);
 document.getElementById('themeToggle').textContent=darkMode?'☀️ Light':'🌙 Dark';
 for(const id of ['verbs','cards'])if(loaded[id]){
   document.getElementById(id).contentWindow.postMessage({type:'pt-learning-theme',dark:darkMode},'*');
 }
}
function toggleTheme(){darkMode=!darkMode;try{localStorage.setItem('pt-learning-theme',darkMode?'dark':'light')}catch(e){}applyTheme();}

function switchMode(mode){
 if(!loaded[mode]){
  document.getElementById(mode).srcdoc=decodeDocument(documents[mode]);
  loaded[mode]=true;
  document.getElementById(mode).addEventListener('load',function(){this.contentWindow.postMessage({type:'pt-learning-theme',dark:darkMode},'*')},{once:true});
 }
 for(const id of ["verbs","cards"]){
  document.getElementById(id).classList.toggle("active",id===mode);
  const button=document.getElementById(id==="verbs"?"verbsTab":"cardsTab");
  button.classList.toggle("active",id===mode);
  button.setAttribute("aria-pressed",String(id===mode));
 }
 try{localStorage.setItem("pt-learning-active-mode",mode)}catch(e){}
}
let initial="verbs";
try{if(localStorage.getItem("pt-learning-active-mode")==="cards")initial="cards"}catch(e){}
applyTheme();switchMode(initial);
</script>
